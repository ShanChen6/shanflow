packages:
  - 'apps/*'
  - 'packages/*'

# Same-major security fix for Prisma CLI's pinned, unused MySQL driver.
overrides:
  'prisma@7.10.0>mysql2': '3.23.1'
  # SEC-01 (GHSA-ggr8-5vv4-36mx): patched major for @prisma/config's merger.
  '@prisma/config@7.10.0>deepmerge-ts': '8.0.2'

allowBuilds:
  '@prisma/engines': true
  prisma: true
  '@nestjs/core': false
  sharp: false
  unrs-resolver: false
  # Prebuilt native binaries ship in the package; no install script is needed.
  argon2: false

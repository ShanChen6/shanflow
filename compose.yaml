name: shanflow

services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shanflow}
      POSTGRES_USER: ${POSTGRES_USER:-shanflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 stores PGDATA under /var/lib/postgresql/18/docker.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Full stack: `docker compose --profile app up -d --build`
  # (start postgres and provision roles first; see docs/guides/environment-setup.md).
  # Required values (role passwords, JWT_ACCESS_SECRET) are validated by the containers themselves:
  # Compose interpolates every service, so `:?` here would break `docker compose up postgres`.
  migrate:
    profiles: [app]
    build: { context: ., target: api }
    restart: "no"
    working_dir: /repo/apps/api
    command: ["pnpm", "db:migrate:deploy"]
    environment: &api-env
      # Connection URLs are derived from these parts inside the container (apps/api/src/config/database-url.ts).
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-shanflow}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:-}
      NODE_ENV: development
      PORT: "3001"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      JWT_ISSUER: ${JWT_ISSUER:-shanflow-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-shanflow-web}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:3001}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-console}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Shanflow <no-reply@localhost>}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    depends_on:
      postgres: { condition: service_healthy }

  api:
    profiles: [app]
    build: { context: ., target: api }
    restart: unless-stopped
    environment: *api-env
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    volumes:
      - avatar_data:/data/avatars
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    profiles: [app]
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api: { condition: service_healthy }

volumes:
  avatar_data:
  postgres_data:
